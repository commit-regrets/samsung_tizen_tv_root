# DU7170 remote mapping config.
# Input device: "Smart Control" at /dev/input/event4
# Mode: observe (log key codes without intercepting)
# Switch to filter once key codes are confirmed.
device=/dev/input/event4
mode=observe

# Key mappings (activate by switching mode to "filter"):
# map.<code>=launch:<app-id>
# Example: map color button to TV Settings
# map.140=launch:com.samsung.tv.coba.setting
